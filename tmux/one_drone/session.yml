# do not modify these
root: ./
name: simulation
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
# you can modify these
startup_window: status
pre_window: export UAV_NAME=uav1;
            export UAV_TYPE=x500;
            export PLATFORM_CONFIG=`ros2 pkg prefix mrs_uav_o3de_api`/share/mrs_uav_o3de_api/config/mrs_uav_system/$UAV_TYPE.yaml;
            export USE_SIM_TIME="true";
            export RMW_IMPLEMENTATION=rmw_zenoh_cpp;
            export O3DE_PROJECT=${O3DE_PROJECT:-~/git/o3de_drone_sim};
            export O3DE_LEVEL=${O3DE_LEVEL:-demolevel}
windows:
  - router:
      layout: tiled
      panes:
        - ros2 run rmw_zenoh_cpp rmw_zenohd
  - simulator:
      layout: tiled
      panes:
        - cd $O3DE_PROJECT/build/linux/bin/profile && ./DroneSim.GameLauncher --project-path=$O3DE_PROJECT --bg_ConnectToAssetProcessor=0 --t_simulationTickDeltaOverride=17000 --r_multiSampleCount=1 --r_renderScale=0.5 --loadlevel=levels/$O3DE_LEVEL/$O3DE_LEVEL.spawnable
  - hw_api:
      layout: tiled
      panes:
        - ros2 launch mrs_uav_o3de_api hw_api.launch.py custom_config:=./config/hw_api.yaml
  - core:
      layout: tiled
      panes:
        - ros2 launch mrs_uav_core core.launch.py
          platform_config:=$PLATFORM_CONFIG
          world_config:=./config/world_config.yaml
          custom_config:=./config/custom_config.yaml
          network_config:=./config/network_config.yaml
  - status:
      layout: tiled
      panes:
        - ros2 run mrs_uav_status status.sh
  - takeoff:
      layout: tiled
      panes:
        - ros2 launch mrs_uav_autostart automatic_start.launch.py custom_config:=./config/automatic_start.yaml
        - waitForCore && ./takeoff.sh
  - rviz:
      layout: tiled
      panes:
        - ros2 run rviz2 rviz2 -d ./rviz.rviz --ros-args -p use_sim_time:=true
  - foxglove_bridge:
      layout: tiled
      panes:
        - ros2 launch foxglove_bridge foxglove_bridge_launch.xml
  - layout:
      layout: tiled
      panes:
        - waitForCore; ~/.i3/layout_manager.sh ./layout.json
