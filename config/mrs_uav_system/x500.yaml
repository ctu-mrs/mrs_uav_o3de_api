uav_mass: 2.0

motor_params:
  n_motors: 4
  a: 0.22588 # 1 / sqrt(k_f * omega_max^2) of the O3DE Multirotor motor model
  b: 0.0

mrs_uav_managers:

  constraint_manager:

    default_constraints:
      gps_garmin: "medium"
      gps_baro: "medium"
      rtk: "medium"
      aloam: "slow"
      hector_garmin: "slow"
      vio: "slow"
      optflow: "slow"
      other: "slow"
      ground_truth: "medium"

